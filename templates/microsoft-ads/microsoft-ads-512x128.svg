<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="512px" height="128px" viewBox="0 0 512 128">
<title>Microsoft Advertising 512x128</title>
<desc>Microsoft Advertising 512x128 | RGB | 72 dpi | guides on locked layers. Delete or hide guide layers before export.</desc>
<g id="Background" inkscape:groupmode="layer" inkscape:label="Background"><rect width="512" height="128" fill="#ffffff"/></g>
<g id="Artwork" inkscape:groupmode="layer" inkscape:label="Artwork">
</g>
<g id="Safe-Zone" inkscape:groupmode="layer" inkscape:label="Safe Zone" sodipodi:insensitive="true">
<rect x="6.5" y="6.5" width="499" height="115" fill="none" stroke="rgb(30,170,80)" stroke-width="1"/>
</g>
<g id="Trim" inkscape:groupmode="layer" inkscape:label="Trim" sodipodi:insensitive="true">
<rect x="0.5" y="0.5" width="511" height="127" fill="none" stroke="rgb(0,150,220)" stroke-width="1"/>
</g>
<g id="Guides" inkscape:groupmode="layer" inkscape:label="Guides" sodipodi:insensitive="true">
<line x1="256" y1="0" x2="256" y2="128" stroke="rgb(160,90,220)" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="0" y1="64" x2="512" y2="64" stroke="rgb(160,90,220)" stroke-width="1" stroke-dasharray="6 4"/>
</g>
</svg>