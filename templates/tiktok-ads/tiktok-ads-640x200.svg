<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="640px" height="200px" viewBox="0 0 640 200">
<title>TikTok Ads 640x200</title>
<desc>TikTok Ads 640x200 | RGB | 72 dpi | guides on locked layers. Delete or hide guide layers before export.</desc>
<g id="Background" inkscape:groupmode="layer" inkscape:label="Background"><rect width="640" height="200" fill="#ffffff"/></g>
<g id="Artwork" inkscape:groupmode="layer" inkscape:label="Artwork">
</g>
<g id="Safe-Zone" inkscape:groupmode="layer" inkscape:label="Safe Zone" sodipodi:insensitive="true">
<rect x="10.5" y="10.5" width="619" height="179" fill="none" stroke="rgb(30,170,80)" stroke-width="1"/>
</g>
<g id="Trim" inkscape:groupmode="layer" inkscape:label="Trim" sodipodi:insensitive="true">
<rect x="0.5" y="0.5" width="639" height="199" fill="none" stroke="rgb(0,150,220)" stroke-width="1"/>
</g>
<g id="Guides" inkscape:groupmode="layer" inkscape:label="Guides" sodipodi:insensitive="true">
<line x1="320" y1="0" x2="320" y2="200" stroke="rgb(160,90,220)" stroke-width="1" stroke-dasharray="6 4"/>
<line x1="0" y1="100" x2="640" y2="100" stroke="rgb(160,90,220)" stroke-width="1" stroke-dasharray="6 4"/>
</g>
</svg>